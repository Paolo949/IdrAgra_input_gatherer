[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idragather"
version = "0.15.0"
description = "Small, QGIS-independent input acquisition core for IdrAgra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
era5 = ["cdsapi>=0.7"]

[project.scripts]
idragather = "IdrAgraGather.core.cli:main"

[tool.ruff]
line-length = 130

[tool.setuptools.packages.find]
where = ["src"]
include = ["IdrAgraGather", "IdrAgraGather.core*"]

[tool.setuptools.package-data]
IdrAgraGather = [
    "metadata.txt",
    "core/_rosetta_data/*.npz",
    "core/_rosetta_data/*.txt",
    "core/_rosetta_data/*.md",
]
